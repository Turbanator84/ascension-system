name: Build, sync Brightspace and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
      - name: Sync Brightspace calendar
        run: node scripts/sync-brightspace.mjs
        env:
          BRIGHTSPACE_ICS_URL: ${{ secrets.BRIGHTSPACE_ICS_URL }}
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
