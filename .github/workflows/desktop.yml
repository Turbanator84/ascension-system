name: Desktop app (Rust)

# - Pull requests and pushes to main: run the Rust tests, check the Rust engine
#   matches the website's engine, and build installers you can download from the run.
# - Tags named desktop-v* (e.g. desktop-v0.1.0): build installers and attach them
#   to a draft GitHub release.
on:
  pull_request:
    paths: ['desktop/**', 'src/app.html', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'src/app.html', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and engine parity
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the app window
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build the UI bundle and WebAssembly engine
        run: cargo run -q -p xtask -- frontend
      - name: Rust tests
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rust engine matches the JavaScript engine
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tests/parity.mjs 400

  build:
    name: Installers (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the app window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.rust_target && format(',{0}', matrix.rust_target) || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tauri command-line tool
        run: npm install -g @tauri-apps/cli@2
      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          tauriScript: tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Ascension System desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Installers for Windows, macOS and Linux. See the README for how to open them the first time.'
          releaseDraft: true
      - name: Keep the installers with this run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ascension-desktop-${{ matrix.name }}
          path: |
            desktop/target/**/release/bundle/msi/*.msi
            desktop/target/**/release/bundle/nsis/*.exe
            desktop/target/**/release/bundle/dmg/*.dmg
            desktop/target/**/release/bundle/deb/*.deb
            desktop/target/**/release/bundle/rpm/*.rpm
            desktop/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
